<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>随手复制控制中心</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup-shell">
      <section class="control-bar" aria-label="悬浮面板总开关">
        <span class="status-dot" data-ref="status-dot" aria-hidden="true"></span>
        <span class="control-copy">
          <small>全局悬浮面板</small>
          <strong data-ref="enabled-label">已开启</strong>
        </span>
        <label class="switch">
          <span class="visually-hidden">开启或关闭悬浮面板</span>
          <input data-ref="enabled-toggle" type="checkbox" role="switch" />
          <span class="switch-track" aria-hidden="true"><i></i></span>
        </label>
      </section>

      <section class="hero">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M8 5.75A2.75 2.75 0 0 1 10.75 3h7.5A2.75 2.75 0 0 1 21 5.75v7.5A2.75 2.75 0 0 1 18.25 16H17v1.25A3.75 3.75 0 0 1 13.25 21h-7.5A3.75 3.75 0 0 1 2 17.25v-7.5A3.75 3.75 0 0 1 5.75 6H7v-.25Zm1 2.5v5A1.75 1.75 0 0 0 10.75 15h2.5A1.75 1.75 0 0 0 15 13.25v-5a.25.25 0 0 0-.25-.25h-5.5a.25.25 0 0 0-.25.25Z" />
          </svg>
        </div>
        <div>
          <span class="version" data-ref="version">v1.3.0</span>
          <h1>随手复制</h1>
          <p>常用文字，一点即用</p>
        </div>
      </section>

      <section class="summary" aria-label="本机保存的数据统计">
        <div>
          <strong data-ref="group-count">0</strong>
          <span>个分类</span>
        </div>
        <i aria-hidden="true"></i>
        <div>
          <strong data-ref="snippet-count">0</strong>
          <span>条内容</span>
        </div>
      </section>

      <button class="open-button" data-ref="open-button" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6" /></svg>
        <span>在当前网页打开并展开</span>
      </button>

      <p class="page-message" data-ref="page-message" role="status" aria-live="polite">
        正在检查当前网页…
      </p>

      <section class="tips" aria-label="操作说明">
        <div>
          <span class="tip-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M12 3v18M7 8l5-5 5 5M7 16l5 5 5-5" /></svg>
          </span>
          <span><strong>面板内箭头</strong><small>收起为右侧标签</small></span>
        </div>
        <div>
          <span class="tip-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="3" /><path d="M8 10h.01M12 10h.01M16 10h.01M8 14h8" /></svg>
          </span>
          <span><strong>Alt + Shift + C</strong><small>快速展开或收起</small></span>
        </div>
      </section>

      <footer>
        <span><i aria-hidden="true"></i> 数据仅保存在本机</span>
        <span>关闭不会删除记录</span>
      </footer>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
